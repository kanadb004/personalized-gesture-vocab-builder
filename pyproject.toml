[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvb"
version = "0.1.0"
description = "Personalized Gesture Vocabulary Builder: a few-shot, training-free AAC gesture tool"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Aadit Singh" },
    { name = "Kanad Bhattacharya" },
]

[project.scripts]
pgvb = "pgvb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
